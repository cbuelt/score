# Output layout for the epoch-budget ablation.
#
# Identical to `hydra/default` except that the directory is pinned to
# `epoch_budget/` instead of being derived from ${task_name}. The ablation
# composes the *training* experiment configs verbatim (that is what makes its
# arms the models actually trained), and those set `task_name: train` from
# experiments/train/settings.yaml -- so a ${task_name}-derived path would file
# every ablation run under the training tree, next to the main runs.
run:
  dir: ${paths.log_dir}/epoch_budget/runs/${now:%Y-%m-%d}_${now:%H-%M-%S}
sweep:
  dir: ${paths.log_dir}/epoch_budget/multiruns/${now:%Y-%m-%d}_${now:%H-%M-%S}
  subdir: ${hydra.job.num}

job_logging:
  handlers:
    file:
      # Incorporates fix from https://github.com/facebookresearch/hydra/pull/2242
      filename: ${hydra.runtime.output_dir}/epoch_budget.log
