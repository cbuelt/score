# @package _global_
# ERA5, SCORE with the two-stage fit on the U-Cast (Dhariwal) UNet.
defaults:
  - /experiments/train: settings
  # Per-stage optimizer+scheduler bundles: stage 2 resumes from the converged
  # stage-1 marginals, so it gets the fine-tuning preset. Must precede the
  # `override` entries -- Hydra requires those at the end of a defaults list.
  - /optimizer@optimizer_stage1: optimizer
  - /optimizer@optimizer_stage2: optimizer_ft
  - override /datamodule: era5
  - override /backbone: ucast
  - override /method: score

# SCORE two-stage fit: train() dispatches to train_staged, which fits the mean
# and marginal variances first (stage 1), then freezes them and fits the
# correlation core (stage 2).
staged: True

datamodule:
  downscaling_factor: 1

# Optimizers. Note the nested path: train.py reads optimizer_stage*.optimizer.lr,
# so a bare `optimizer_stage1.lr` here would be silently ignored.
optimizer_stage1:
  optimizer:
    lr: 3.0e-4
    weight_decay: 0.1
    betas: [0.9, 0.95]
optimizer_stage2:
  optimizer:
    lr: 7.0e-5
    weight_decay: 0.1

trainer:
  max_epochs: 30
stage1_max_epochs: 20
stage2_max_epochs: 10

# Single-channel 2D field: weight the variogram score by inverse grid distance,
# emphasizing the short-range pairs where the covariance parameterizations differ.
variogram:
  weight: inv_dist
