# @package _global_
defaults:
  - /experiments/train: settings
  # Stage 1 is the fit that reproduces PatchTST (mu/tau, backbone unfrozen), so
  # it gets upstream's weather recipe: Adam without weight decay, the type3
  # staircase decay, and a patience. Stage 2 (the core fine-tune) has no upstream
  # counterpart and keeps the warmup->cosine preset, which is why it gets no
  # early stopping -- a stop would truncate its anneal.
  - /optimizer@optimizer_stage1: patchtst_type3
  - /optimizer@optimizer_stage2: optimizer_ft
  - override /datamodule: weather
  - override /backbone: patchtst
  - override /method: score
  - override /callbacks@callbacks_stage1: stage1_es

# SCORE two-stage fit: train() dispatches to train_staged, which fits the mean
# and marginal variances first (stage 1), then freezes them and fits the
# correlation core (stage 2).
staged: True

# Data module: multivariate forecasting.
datamodule:
  features: M

# Backbone: same sizing as the single-stage experiment; `shared` carries
# mu+sigma, `other` the correlation core.
backbone:
  n_layers: 2
  d_model: 128
  n_heads: 16
  d_ff: 256
  dropout: 0.2
  head:
    shared_num_blocks: 1
    other_num_blocks: 1

# Optimizers.
optimizer_stage1:
  optimizer:
    lr: 1.0e-4
optimizer_stage2:
  optimizer:
    lr: 1.0e-4

# Early stopping on stage 1 only; upstream's weather patience.
callbacks_stage1:
  early_stopping:
    patience: 20
