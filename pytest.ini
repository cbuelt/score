[pytest]
# Where pytest looks for tests, and the file/function naming it collects.
testpaths = tests
python_files = test_*.py
python_functions = test_*

# Custom markers must be registered here or pytest warns about "unknown marker".
# Run only fast tests:   pytest -m "not realdata"
# Run only the slow ones: pytest -m realdata
markers =
    realdata: tests that read the large real datasets from disk (slow, machine-specific)
